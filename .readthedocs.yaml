# Read the Docs build: Doxygen reads the headers, Breathe turns its XML into
# the API pages, Sphinx renders the site.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - doxygen docs/Doxyfile

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
